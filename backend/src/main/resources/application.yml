server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./data/hedgefund;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  upload:
    dir: ./uploads
  jwt:
    # 32+ byte random secret. Override in production via env var APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:change-me-please-use-at-least-32-bytes-of-random-data-base}
    # Token lifetime in milliseconds (default 24h)
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  auth:
    default-admin:
      username: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:admin123}

